pmsr.landing_page:
  path: '/pmsr'
  defaults:
    _controller: 'Drupal\pmsr\Controller\LandingPageController::content'
    _title: 'PMSR Landing Page'
  requirements:
    _permission: 'access content'

pmsr.statistics:
  path: '/pmsr/statistics'
  defaults:
    _controller: 'Drupal\pmsr\Controller\StatisticsController::content'
    _title: 'Statistics'
  requirements:
    _permission: 'access content'

pmsr.ontologies_list:
  path: '/pmsr/ontologies/list'
  defaults:
    _controller: 'Drupal\pmsr\Controller\StatisticsController::listOntologies'
    _title: 'Ontologies'
  requirements:
    _permission: 'access content'

pmsr.settings:
  path: '/admin/config/pmsr'
  defaults:
    _form: '\Drupal\pmsr\Form\PmsrSettingsForm'
    _title: 'PMSR GUI Module Configurations'
  requirements:
    _permission: 'administer site configuration'

pmsr.access_denied:
  path: '/acess-denied'
  defaults:
    _controller: '\Drupal\pmsr\Controller\AccessDeniedController::accessDeniedPage'
    _title: 'Access Denied'
  requirements:
    _access: 'TRUE'

pmsr.ingest_ontologies:
  path: '/pmsr/ingest/ontologies'
  defaults:
    _controller: '\Drupal\pmsr\Controller\IngestionController::ingestOntologies'
    _title: 'Ingest PMSR Ontologies'
  requirements:
    _permission: 'access content'
    _role: 'authenticated'

pmsr.process_ontology_ingestion:
  path: '/pmsr/api/ingest/ontologies/process'
  defaults:
    _controller: '\Drupal\pmsr\Controller\IngestionController::processOntologyIngestion'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE
  methods: [POST]

pmsr.ingest_instruments:
  path: '/pmsr/ingest/instruments'
  defaults:
    _controller: '\Drupal\pmsr\Controller\IngestionINSController::ingestInstruments'
    _title: 'Ingest INS Instruments'
  requirements:
    _permission: 'access content'
    _role: 'authenticated'

pmsr.process_ins_ingestion:
  path: '/pmsr/api/ingest/ins/process'
  defaults:
    _controller: '\Drupal\pmsr\Controller\IngestionINSController::processINSIngestion'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE
  methods: [POST]

pmsr.process_ins_uningest:
  path: '/pmsr/api/uningest/ins/process'
  defaults:
    _controller: '\Drupal\pmsr\Controller\IngestionINSController::processINSUningest'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE
  methods: [POST]

pmsr.refresh_statistics:
  path: '/pmsr/api/statistics/refresh'
  defaults:
    _controller: '\Drupal\pmsr\Controller\StatisticsController::refreshStatisticsCache'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE
  methods: [POST]

pmsr.api_statistics_global:
  path: '/pmsr/api/statistics/global'
  defaults:
    _controller: '\Drupal\pmsr\Controller\StatisticsController::getGlobalStatistics'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE
  methods: [GET]

pmsr.ingest_geography:
  path: '/pmsr/ingest/geography'
  defaults:
    _controller: '\Drupal\pmsr\Controller\IngestionKgrGeoController::ingestGeography'
    _title: 'Ingest KRG Geography and Organizations'
  requirements:
    _permission: 'access content'
    _role: 'authenticated'

pmsr.process_geography_ingestion:
  path: '/pmsr/api/ingest/geography/process'
  defaults:
    _controller: '\Drupal\pmsr\Controller\IngestionKgrGeoController::processGeographyIngestion'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE
  methods: [POST]

pmsr.ingest_people:
  path: '/pmsr/ingest/people'
  defaults:
    _controller: '\Drupal\pmsr\Controller\IngestionKgrPeopleController::ingestPeople'
    _title: 'Ingest KGR People'
  requirements:
    _permission: 'access content'
    _role: 'authenticated'

pmsr.process_people_ingestion:
  path: '/pmsr/api/ingest/people/process'
  defaults:
    _controller: '\Drupal\pmsr\Controller\IngestionKgrPeopleController::processPeopleIngestion'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE
  methods: [POST]

