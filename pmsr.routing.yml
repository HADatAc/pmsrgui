pmsr.landing_page:
  path: '/pmsr'
  defaults:
    _controller: 'Drupal\pmsr\Controller\LandingPageController::content'
    _title: 'PMSR Landing Page'
  requirements:
    _permission: 'access content'

pmsr.statistics:
  path: '/pmsr/statistics'
  defaults:
    _controller: 'Drupal\pmsr\Controller\StatisticsController::content'
    _title: 'Statistics'
  requirements:
    _permission: 'access content'

pmsr.statistics_simulation_models_breakdown:
  path: '/pmsr/statistics/simulation-models-breakdown'
  defaults:
    _controller: 'Drupal\pmsr\Controller\StatisticsController::simulationModelsBreakdownPage'
    _title: 'Statistics > Simulation Models Breakdown'
  requirements:
    _permission: 'access content'

pmsr.statistics_refresh_page:
  path: '/pmsr/statistics/refresh'
  defaults:
    _controller: 'Drupal\pmsr\Controller\StatisticsController::refreshStatisticsPage'
  requirements:
    _permission: 'access content'
  options:
    no_cache: TRUE

pmsr.ontologies_list:
  path: '/pmsr/ontologies/list'
  defaults:
    _controller: 'Drupal\pmsr\Controller\StatisticsController::listOntologies'
    _title: 'Ontologies'
  requirements:
    _permission: 'access content'

pmsr.settings:
  path: '/admin/config/pmsr'
  defaults:
    _form: '\Drupal\pmsr\Form\PmsrSettingsForm'
    _title: 'PMSR GUI Module Configurations'
  requirements:
    _permission: 'administer site configuration'

pmsr.config_bootstrap:
  path: '/pmsr/config/bootstrap'
  defaults:
    _form: '\Drupal\pmsr\Form\ConfigBootstrapForm'
    _title: 'PMSR Config Bootstrap'
  requirements:
    _permission: 'administer site configuration'

pmsr.bootstrap_localhost_page:
  path: '/pmsr/bootstrap/localhost/page'
  defaults:
    _controller: '\Drupal\pmsr\Controller\BootstrapController::bootstrapLocalhostPage'
    _title: 'Bootstrap Localhost'
  requirements:
    _permission: 'administer site configuration'

pmsr.bootstrap_execute_localhost:
  path: '/pmsr/api/bootstrap/localhost/execute'
  defaults:
    _controller: '\Drupal\pmsr\Controller\BootstrapController::executeLocalhostBootstrap'
  requirements:
    _permission: 'administer site configuration'
  options:
    no_cache: TRUE
  methods: [POST]

pmsr.bootstrap_cloud_page:
  path: '/pmsr/bootstrap/cloud/page'
  defaults:
    _controller: '\Drupal\pmsr\Controller\BootstrapController::bootstrapCloudPage'
